name: Check

# 每次推送或開 Pull Request 時，自動檢查型別、執行測試並試著建置
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'npm'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations and run database tests
        run: |
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/supabase_stub.sql
          for file in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -q -f "$file"; done
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/platform_test.sql 2>&1 | tee result.txt
          grep -q "全部測試通過" result.txt
